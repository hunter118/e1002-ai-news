name: Generate and deploy AI Daily

on:
  schedule:
    # Hourly 08:30-14:30 Asia/Singapore. A cheap RSS preflight allows only the
    # first run that sees today's issue to use OpenAI and deploy.
    - cron: "30 0-6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.freshness.outputs.should_generate }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
      CJK_FONT_PATH: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Check whether today's issue needs generation
        id: freshness
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_generate=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual-dispatch" >> "$GITHUB_OUTPUT"
          else
            python -m backend.freshness --github-output "$GITHUB_OUTPUT"
          fi

      - name: Install Chinese fonts
        if: steps.freshness.outputs.should_generate == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Install backend dependencies
        if: steps.freshness.outputs.should_generate == 'true'
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend tests
        if: steps.freshness.outputs.should_generate == 'true'
        run: python -m pytest backend/tests -q

      - name: Generate validated edition
        if: steps.freshness.outputs.should_generate == 'true'
        run: python -m backend.generate

      - name: Validate publish artifact
        if: steps.freshness.outputs.should_generate == 'true'
        run: |
          test "$(find public/pages -name 'page_*.png' -type f | wc -l)" -eq 6
          test "$(find public/pages -name 'page_*.epd' -type f | wc -l)" -eq 6
          python -c 'import json,pathlib; m=json.loads(pathlib.Path("public/manifest.json").read_text()); assert m["page_count"] == 6 and len(m["pages"]) == 6; assert all(p["size"] == 192000 for p in m["pages"])'

      - name: Configure GitHub Pages
        if: steps.freshness.outputs.should_generate == 'true'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: steps.freshness.outputs.should_generate == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: generate
    if: needs.generate.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
