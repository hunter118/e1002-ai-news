name: Build E1002 gallery

on:
  push:
    branches:
      - main
    paths:
      - "gallery/photos/**"
      - "gallery/config.json"
      - "backend/build_gallery.py"
      - "backend/render.py"
      - "backend/requirements.txt"
      - ".github/workflows/gallery-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gallery-sync
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out gallery source
        uses: actions/checkout@v7
        with:
          path: source

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source/backend/requirements.txt

      - name: Install image converter
        run: python -m pip install Pillow==12.1.1 pydantic==2.12.5

      - name: Build and validate gallery
        run: |
          cd source
          python -m backend.build_gallery \
            --photos gallery/photos \
            --config gallery/config.json \
            --output "$RUNNER_TEMP/gallery"

      - name: Check out gallery delivery branch
        uses: actions/checkout@v7
        with:
          ref: gallery
          path: publish

      - name: Publish a history-free snapshot only when changed
        run: |
          if diff -qr --exclude=.git "$RUNNER_TEMP/gallery" publish; then
            echo "Gallery is already current"
          else
            git -C publish config user.name "github-actions[bot]"
            git -C publish config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C publish switch --orphan gallery-snapshot
            cp -R "$RUNNER_TEMP/gallery/." publish/
            git -C publish add -A
            git -C publish commit -m "Sync current gallery snapshot"
            git -C publish push --force origin HEAD:gallery
          fi
